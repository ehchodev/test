<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 기출문제 풀이 프로그램</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-card">
    <div id="quiz-screen">
      <div id="progress" style="font-size: 0.9em; color: #6c757d;"></div>
      <h3 id="question-text" style="margin-top: 10px;"></h3>
      <div id="options-container" class="options"></div>
      <div id="explanation" class="explanation hidden">
        <span id="explanation-title">해설</span>
        <p id="explanation-text"></p>
      </div>
      <button id="next-btn" class="btn hidden" onclick="nextQuestion()">다음 문제</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
      <h2>풀이 완료!</h2>
      <p id="score-text" style="font-size: 1.2em;"></p>
      <button class="btn" onclick="restartQuiz()">다시 풀기</button>
    </div>
  </div>

  <!--<script src="data.js"></script>-->
  <script src="data_gemini.js"></script>
  <script>
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 2. 피셔-예이츠(Fisher-Yates) 셔플 함수 (랜덤 섞기)
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // 3. 퀴즈 시작 및 초기화
    function initQuiz() {
      currentQuestions = shuffleArray(quizData);
      currentIndex = 0;
      score = 0;
      document.getElementById("quiz-screen").classList.remove("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      loadQuestion();
    }

    // 4. 문제 출력
    function loadQuestion() {
      const current = currentQuestions[currentIndex];
      
      // 진행 상황 표시
      document.getElementById("progress").textContent = 
        `문제 ${currentIndex + 1} / ${currentQuestions.length}`;
      
      // 질문 텍스트 출력
      document.getElementById("question-text").textContent = 
    	`${currentIndex + 1}. ${current.question}`;
      
      // 보기 생성
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";
      
      current.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = `${index + 1}. ${optText}`;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
      });

      // 해설 및 다음 버튼 숨기기
      document.getElementById("explanation").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");
    }

    // 5. 정답 확인
    function checkAnswer(selectedIndex) {
      const current = currentQuestions[currentIndex];
      const buttons = document.querySelectorAll(".option-btn");
      
      // 모든 보기 버튼 비활성화 (중복 클릭 방지)
      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if ((index + 1) === current.answer) {
          btn.classList.add("correct");
        } else if (index === selectedIndex) {
          btn.classList.add("wrong");
        }
      });

      if (selectedIndex === current.answer) {
        score++;
      }

      // 해설 및 다음 버튼 표시
      const expBox = document.getElementById("explanation-text");
      expBox.textContent = `${current.explanation}`;
      expBox.parentElement.classList.remove("hidden");

      document.getElementById("next-btn").classList.remove("hidden");
    }

    // 6. 다음 문제로 이동
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    // 7. 결과 화면 출력
    function showResults() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      document.getElementById("score-text").textContent = 
        `총 ${currentQuestions.length}문제 중 ${score}문제를 맞혔습니다!`;
    }

    // 8. 재시작
    function restartQuiz() {
      initQuiz();
    }

    // 페이지 로드 시 퀴즈 시작
    window.onload = initQuiz;
  </script>

</body>
</html>
