<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 기출문제 풀이 프로그램</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f6f8;
    }
    .quiz-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .options {
      margin-top: 15px;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      text-align: left;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
    }
    .option-btn:hover {
      background: #e9ecef;
    }
    .option-btn.correct {
      background-color: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
    }
    .option-btn.wrong {
      background-color: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }
    .btn {
      margin-top: 15px;
      padding: 10px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .explanation {
      margin-top: 15px;
      padding: 12px;
      background-color: #e2e3e5;
      border-radius: 6px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <div id="quiz-screen">
      <div id="progress" style="font-size: 0.9em; color: #6c757d;"></div>
      <h3 id="question-text" style="margin-top: 10px;"></h3>
      <div id="options-container" class="options"></div>
      <div id="explanation" class="explanation hidden"></div>
      <button id="next-btn" class="btn hidden" onclick="nextQuestion()">다음 문제</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
      <h2>풀이 완료!</h2>
      <p id="score-text" style="font-size: 1.2em;"></p>
      <button class="btn" onclick="restartQuiz()">다시 풀기</button>
    </div>
  </div>

  <script>
    // 1. 기출문제 데이터베이스
    const quizData = [
      {
        question: "1. HTML의 약자로 옳은 것은?",
        options: [
          "HyperText Markup Language",
          "HighText Machine Language",
          "HyperText Marking Language",
          "Hyperlink Text Markup Language"
        ],
        answer: 0,
        explanation: "HTML은 HyperText Markup Language의 약자입니다."
      },
      {
        question: "2. 자바스크립트에서 변수를 선언하는 키워드가 아닌 것은?",
        options: ["var", "let", "const", "define"],
        answer: 3,
        explanation: "define은 C언어 등에서 전처리기로 쓰이며, JS 변수 선언 키워드가 아닙니다."
      },
      {
        question: "3. CSS에서 배경색을 지정하는 속성은?",
        options: ["color", "background-color", "font-weight", "border-color"],
        answer: 1,
        explanation: "background-color 속성을 통해 요소의 배경색을 설정합니다."
      }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 2. 피셔-예이츠(Fisher-Yates) 셔플 함수 (랜덤 섞기)
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // 3. 퀴즈 시작 및 초기화
    function initQuiz() {
      currentQuestions = shuffleArray(quizData);
      currentIndex = 0;
      score = 0;
      document.getElementById("quiz-screen").classList.remove("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      loadQuestion();
    }

    // 4. 문제 출력
    function loadQuestion() {
      const current = currentQuestions[currentIndex];
      
      // 진행 상황 표시
      document.getElementById("progress").textContent = 
        `문제 ${currentIndex + 1} / ${currentQuestions.length}`;
      
      // 질문 텍스트 출력
      document.getElementById("question-text").textContent = current.question;
      
      // 보기 생성
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";
      
      current.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = `${index + 1}. ${optText}`;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
      });

      // 해설 및 다음 버튼 숨기기
      document.getElementById("explanation").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");
    }

    // 5. 정답 확인
    function checkAnswer(selectedIndex) {
      const current = currentQuestions[currentIndex];
      const buttons = document.querySelectorAll(".option-btn");
      
      // 모든 보기 버튼 비활성화 (중복 클릭 방지)
      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === current.answer) {
          btn.classList.add("correct");
        } else if (index === selectedIndex) {
          btn.classList.add("wrong");
        }
      });

      if (selectedIndex === current.answer) {
        score++;
      }

      // 해설 및 다음 버튼 표시
      const expBox = document.getElementById("explanation");
      expBox.textContent = `[해설] ${current.explanation}`;
      expBox.classList.remove("hidden");

      document.getElementById("next-btn").classList.remove("hidden");
    }

    // 6. 다음 문제로 이동
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    // 7. 결과 화면 출력
    function showResults() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      document.getElementById("score-text").textContent = 
        `총 ${currentQuestions.length}문제 중 ${score}문제를 맞혔습니다!`;
    }

    // 8. 재시작
    function restartQuiz() {
      initQuiz();
    }

    // 페이지 로드 시 퀴즈 시작
    window.onload = initQuiz;
  </script>

</body>
</html>
